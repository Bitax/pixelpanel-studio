name: 🐞 Bug / Fehler
description: Something doesn't work as expected · Etwas funktioniert nicht wie erwartet
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        English or German – both are fine. Please never post passwords or tokens. · Englisch oder Deutsch – beides ist okay. Bitte nie Passwörter oder Tokens posten.
  - type: textarea
    id: description
    attributes:
      label: What happened? / Was ist passiert?
      description: What did you do, what happened, what did you expect? · Was hast du gemacht, was ist passiert, was hättest du erwartet?
    validations:
      required: true
  - type: textarea
    id: tech
    attributes:
      label: Technical info (filled in by the Studio, optional) / Technische Infos (vom Studio ausgefüllt, optional)
      render: text
