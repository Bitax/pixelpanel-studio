# Community-Icons: prüft Vorschläge (Vorschaubild als Kommentar) und hält community/icons.json aktuell.
# Ablauf: Nutzer schlägt im Studio ein Icon vor → Issue mit Label „icon-suggestion“ → Bot kommentiert mit Vorschau.
#   Label „icon-accepted“  → Icon kommt in community/icons.json, Danke-Kommentar, Issue wird geschlossen.
#   Label „icon-rejected“  → Icon wird (falls drin) wieder entfernt bzw. nicht aufgenommen, Issue wird geschlossen.
# Jeder Lauf gleicht den GANZEN Katalog mit den Labels ab. Bricht GitHub einen wartenden Lauf ab (passiert, wenn
# mehrere Icons kurz hintereinander bestätigt werden), holt der nächste Lauf alles nach.
# „Run workflow“ (manuell) legt die Labels an und gleicht den Katalog ebenfalls ab.
# Sicherheit: Issue-Texte werden nur als Daten gelesen, nie ausgeführt.
name: Community-Icons

on:
  issues:
    types: [opened, edited, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  labels:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Labels anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create icon-suggestion --color 5E5CE6 --description "Icon suggestion from the Studio / Icon-Vorschlag" --force
          gh label create icon-accepted   --color 34C759 --description "Icon goes into the community catalog / wird übernommen" --force
          gh label create icon-rejected   --color 8E8E93 --description "Icon will not be added / wird nicht übernommen" --force
          gh label create idea            --color FF9F0A --description "Feature request / Verbesserungsvorschlag" --force
          gh label create bug             --color FF453A --description "Something isn't working / Fehler" --force
          gh label create planned         --color 0A84FF --description "Planned for the next version" --force
          gh label create wontfix         --color FFFFFF --description "This will not be worked on" --force
          gh label create needs-info      --color D4C5F9 --description "More information needed" --force

  preview:
    if: github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'edited') && contains(github.event.issue.labels.*.name, 'icon-suggestion')
    runs-on: ubuntu-latest
    concurrency:
      group: icon-preview-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Icon prüfen und Vorschau kommentieren
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python .github/scripts/community_icons.py preview

  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
       (github.event.label.name == 'icon-accepted' || github.event.label.name == 'icon-rejected'))
    runs-on: ubuntu-latest
    concurrency:
      group: community-icons-catalog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Katalog mit den Labels abgleichen
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python .github/scripts/community_icons.py sync
      - name: Speichern
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community/icons.json
          git commit -m "Community-Icons aktualisiert"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: Bescheid geben und schließen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python .github/scripts/community_icons.py notify
